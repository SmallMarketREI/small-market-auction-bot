name: Daily auction data update

on:
  schedule:
    # 11:00 UTC = 7:00 AM Asia/Manila is NOT this -- Elijah is in Asia/Manila
    # (UTC+8), and the auctions are all Eastern-time WV properties, so this
    # runs at 09:00 America/New_York (handles EST/EDT drift within a couple
    # hours either way, which doesn't matter for a "once a day" refresh):
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape past sales
        id: past_sales
        run: python scrape_past_sales.py

      - name: Scrape watch/live bids
        id: watch_bids
        run: python scrape_watch_bids.py

      - name: Enrich square footage from WV Assessment
        id: sqft_enrichment
        # Never fails the job -- unresolved parcels are normal and get flagged
        # in Needs Review rather than treated as a pipeline error.
        run: python enrich_sqft_wv.py

      - name: Fail the run if a scraping step broke
        if: steps.past_sales.outcome == 'failure' || steps.watch_bids.outcome == 'failure'
        run: |
          echo "One or more scrapers failed -- check the step logs above."
          exit 1
