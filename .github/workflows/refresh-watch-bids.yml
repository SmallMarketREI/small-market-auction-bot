name: Refresh live auction bids

# Runs more often than the main daily update -- just re-checks current bid
# amounts on already-known active/upcoming auctions, so "current high bid" on
# the dashboard doesn't go stale for hours between the once-a-day full run.
# Past sales and square footage enrichment stay on the daily schedule in
# daily-update.yml; this workflow only ever touches watch_auctions.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh watch/live bids
        run: python scrape_watch_bids.py
